name: threadsite

services:
  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15-rootless}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      FORGEJO__server__ROOT_URL: ${FORGEJO_PUBLIC_URL:-http://localhost:3000}
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__LOCAL_ROOT_URL: http://forgejo:3000/
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: public
      # Forgejo refuses to POST webhooks to private/loopback addresses unless
      # the target host is allowlisted, so without this every push event to
      # http://bot:8901 is rejected ("webhook can only call allowed HTTP
      # servers"). The bot treats its listener as live regardless, so it also
      # never starts the polling fallback — pushes are missed silently.
      FORGEJO__webhook__ALLOWED_HOST_LIST: ${FORGEJO_WEBHOOK_ALLOWED_HOSTS:-bot}
    volumes:
      - forgejo-data:/var/lib/gitea
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3000}:3000"

  opencode:
    build:
      context: ./opencode
    restart: unless-stopped
    environment:
      XDG_DATA_HOME: /opencode-data
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-change-this-internal-password}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # Pre-selected v2 search provider; without it OpenCode asks a first-use
      # consent form that would surface to Discord users. Keys are optional.
      OPENCODE_WEBSEARCH_PROVIDER: ${OPENCODE_WEBSEARCH_PROVIDER:-exa}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      OPENCODE_LOG_LEVEL: ${OPENCODE_LOG_LEVEL:-INFO}
      OPENCODE_MAX_STEPS: ${OPENCODE_MAX_STEPS:-200}
      OPENCODE_SUBAGENT_MODEL: ${OPENCODE_SUBAGENT_MODEL:-}
      OPENCODE_BROWSER_QA_MODEL: ${OPENCODE_BROWSER_QA_MODEL:-}
      CONTEXT7_ENABLED: ${CONTEXT7_ENABLED:-1}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-8388608}
      ASSET_DOWNLOAD_TIMEOUT_MS: ${ASSET_DOWNLOAD_TIMEOUT_MS:-30000}
      ASSET_ALLOW_HTTP: ${ASSET_ALLOW_HTTP:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      SURPLUS_API_KEY: ${SURPLUS_API_KEY:-}
      SURPLUS_BASE_URL: ${SURPLUS_BASE_URL:-https://api.surplusintelligence.ai/v1}
      SURPLUS_MODELS: ${SURPLUS_MODELS:-}
      SURPLUS_CONTEXT_CAP: ${SURPLUS_CONTEXT_CAP:-}
    volumes:
      - ./data/workspaces:/workspace
      - opencode-data:/opencode-data
    expose:
      - "4096"
    networks:
      - default
      - preview
    depends_on:
      preview:
        condition: service_healthy

  # Existing Microsoft Playwright MCP, plus a read-only, in-memory TS preview.
  # No host port, credentials, published files, or access to the default network.
  preview:
    build:
      context: ./preview
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # No GPU: Chromium renders through SwiftShader, which is CPU-bound and
    # scales with cores, so this is the service's throughput knob. 2 CPUs left
    # most of an 8-thread host idle while screenshots timed out; 4 keeps
    # headroom for OpenCode's LSP/tsc work running alongside it.
    shm_size: ${PREVIEW_SHM_SIZE:-512m}
    mem_limit: ${PREVIEW_MEMORY:-3g}
    cpus: ${PREVIEW_CPUS:-4}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      WORKSPACE_ROOT: /workspace
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
      # Several threads may preview at once. Builds queue above this limit
      # instead of answering "Preview is busy" (which reached the agent as a
      # blank page), and the snapshot cache holds one entry per active thread.
      PREVIEW_BUILD_CONCURRENCY: ${PREVIEW_BUILD_CONCURRENCY:-4}
      PREVIEW_BUILD_QUEUE_TIMEOUT_MS: ${PREVIEW_BUILD_QUEUE_TIMEOUT_MS:-30000}
      PREVIEW_SNAPSHOT_CACHE: ${PREVIEW_SNAPSHOT_CACHE:-16}
    volumes:
      - ./data/workspaces:/workspace:ro
    expose:
      - "8931"
    networks:
      - preview

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCODE_URL: ${OPENCODE_URL:-http://opencode:4096}
      FORGEJO_INTERNAL_URL: ${FORGEJO_INTERNAL_URL:-http://forgejo:3000}
      FORGEJO_TOKEN_FILE: ${FORGEJO_TOKEN_FILE:-/run/secrets/forgejo-token}
      FORGEJO_ADMIN_TOKEN_FILE: ${FORGEJO_ADMIN_TOKEN_FILE:-/run/secrets/forgejo-admin-token}
      MULTIPLAYER_ENABLED: ${MULTIPLAYER_ENABLED:-true}
      GAMESERVER_PUBLIC_URL: ${GAMESERVER_PUBLIC_URL:-ws://localhost:8090/ws}
      GAMESERVER_INTERNAL_URL: ${GAMESERVER_INTERNAL_URL:-http://gameserver:8090}
      GAMESERVER_ADMIN_TOKEN_FILE: /run/threadsite-control/cleanup-token
      WORKSPACE_ROOT: /workspace
      PUBLISH_ROOT: /srv/sites
      STATE_DB_FILE: /data/state.db
      # Browser QA drives the preview service's Playwright MCP; the bot joins
      # the internal preview network to reach it (no host exposure).
      PREVIEW_MCP_URL: ${PREVIEW_MCP_URL:-http://preview:8931/mcp}
    healthcheck:
      # The bot's own HTTP listener (webhooks + /healthz, default port 8901).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.WEBHOOK_PORT || '8901') + '/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./data/workspaces:/workspace
      - ${SITES_HOST_PATH:-./data/sites}:/srv/sites
      - ./data/bot:/data
      - cleanup-control:/run/threadsite-control
      - ./secrets/forgejo-token:/run/secrets/forgejo-token:ro
      - ./secrets/forgejo-admin-token:/run/secrets/forgejo-admin-token:ro
    networks:
      - default
      - preview
    depends_on:
      forgejo:
        condition: service_started
      opencode:
        condition: service_healthy
      gameserver:
        condition: service_started
      preview:
        condition: service_started
    ports:
      # Loopback-only: serves /healthz and the Forgejo push webhook.
      - "127.0.0.1:${BOT_HTTP_PORT:-8901}:8901"

  # One shared multi-tenant multiplayer relay for every generated game.
  # Tenancy is the game id (site slug); rooms are namespaced per game, so a
  # single instance serves any number of games without per-game processes.
  # Browsers reach it through GAMESERVER_PUBLIC_URL (loopback port by default;
  # proxy wss:// via host Apache for production, see apache/ examples).
  gameserver:
    build:
      context: ./gameserver
    restart: unless-stopped
    environment:
      GAMESERVER_HOST: 0.0.0.0
      # The container always listens on 8090; GAMESERVER_PORT only picks the host side.
      GAMESERVER_PORT: "8090"
      GAMESERVER_MAX_PEERS_PER_ROOM: ${GAMESERVER_MAX_PEERS_PER_ROOM:-16}
      GAMESERVER_MAX_ROOMS_PER_GAME: ${GAMESERVER_MAX_ROOMS_PER_GAME:-256}
      GAMESERVER_MAX_MESSAGE_BYTES: ${GAMESERVER_MAX_MESSAGE_BYTES:-270336}
      GAMESERVER_MAX_BUFFERED_BYTES: ${GAMESERVER_MAX_BUFFERED_BYTES:-1048576}
      GAMESERVER_RATE_PER_SECOND: ${GAMESERVER_RATE_PER_SECOND:-60}
      GAMESERVER_RATE_BURST: ${GAMESERVER_RATE_BURST:-120}
      GAMESERVER_ROOM_TTL_MS: ${GAMESERVER_ROOM_TTL_MS:-600000}
      # A host silent this long while another peer waits loses authority.
      GAMESERVER_HOST_STALL_MS: ${GAMESERVER_HOST_STALL_MS:-15000}
      GAMESERVER_ALLOWED_ORIGINS: ${GAMESERVER_ALLOWED_ORIGINS:-}
      # permessage-deflate kill switch (0 = off); 1 KB threshold keeps the
      # transform hot path uncompressed while world snapshots compress.
      GAMESERVER_PERMESSAGE_DEFLATE: ${GAMESERVER_PERMESSAGE_DEFLATE:-1}
      # ARENA (single-mode) worlds are persisted here and survive restarts.
      GAMESERVER_STATE_DIR: ${GAMESERVER_STATE_DIR:-/data/threadsite-relay}
      GAMESERVER_PERSIST_INTERVAL_MS: ${GAMESERVER_PERSIST_INTERVAL_MS:-1000}
      GAMESERVER_ADMIN_TOKEN_FILE: /run/threadsite-control/cleanup-token
    volumes:
      - ./data/gameserver:/data
      - cleanup-control:/run/threadsite-control:ro
    ports:
      - "127.0.0.1:${GAMESERVER_PORT:-8090}:8090"

  # Optional. If you already run Apache on the host, do NOT start this profile;
  # just point SITES_HOST_PATH at the directory your host Apache serves.
  static-web:
    image: httpd:2.4-alpine
    profiles: ["bundled-static"]
    restart: unless-stopped
    volumes:
      - ${SITES_HOST_PATH:-./data/sites}:/usr/local/apache2/htdocs:ro
    ports:
      - "${STATIC_PORT:-8080}:80"

  # Optional edge for fresh-server deployments: Caddy with automatic HTTPS.
  # The default publication path stays host Apache (or bundled-static above);
  # enable this profile only when nothing else on the host binds 80/443.
  # Serves the publish root and, through vhosts written into caddy/vhosts/,
  # can also proxy Forgejo and the multiplayer relay. One-command setup:
  # scripts/caddy-quickstart.sh (see caddy/ and docs/deployment.md).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      SITES_DOMAIN: ${SITES_DOMAIN:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # HTTP/3 (QUIC); Caddy advertises it via the TCP listener above.
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/vhosts:/etc/caddy/vhosts:ro
      - ${SITES_HOST_PATH:-./data/sites}:/srv/sites:ro
      # TLS certificates and OCSP staples survive restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      forgejo:
        condition: service_started
      gameserver:
        condition: service_started

volumes:
  forgejo-data:
  opencode-data:
  cleanup-control:
  caddy-data:
  caddy-config:

networks:
  preview:
    internal: true
